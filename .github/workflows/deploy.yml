name: deploy

# A merge to main runs `make up` on both clouds, then puts the GPU to sleep so it does not bill idle.
# Run it by hand (Actions > deploy > Run workflow) to warm, sleep, check status, or tear everything down.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "bench/**", "tests/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "up, warm, sleep, status, or down"
        type: choice
        options: [up, warm, sleep, status, down]
        default: up
      confirm:
        description: "Type destroy to confirm down"
        type: string
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      ACTION: ${{ github.event_name == 'push' && 'up' || inputs.action }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_gcp_project: ${{ vars.GCP_PROJECT }}
      TF_VAR_gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Refuse down without confirmation
        if: env.ACTION == 'down' && inputs.confirm != 'destroy'
        run: |
          echo "::error::down deletes everything on both clouds. Rerun with confirm = destroy."
          exit 1

      - name: Check repository settings
        run: |
          missing=""
          for v in TF_STATE_BUCKET TF_STATE_REGION TF_VAR_gcp_project TF_VAR_gemini_api_key; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          for v in AWS_DEPLOY_ROLE_ARN GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing settings:$missing. See docs/ci.md."; exit 1; fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}

      - uses: actions/checkout@v4

      - name: Free disk for the CUDA image
        if: env.ACTION == 'up'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        if: env.ACTION == 'up'
        with:
          node-version: "22"

      - name: Install the Firebase CLI
        if: env.ACTION == 'up'
        run: npm install -g firebase-tools@15

      - name: make up
        if: env.ACTION == 'up'
        run: make up

      - name: Put the GPU to sleep after deploying
        if: env.ACTION == 'up' && vars.KEEP_WARM != 'true'
        run: make sleep

      - name: make ${{ env.ACTION }}
        if: env.ACTION != 'up'
        run: |
          make init
          make "$ACTION"

      - name: Summary
        if: success() && env.ACTION != 'down'
        run: |
          {
            echo "### ${ACTION} done"
            echo "Page: $(terraform -chdir=infra output -raw hosting_url)"
            echo "Status: $(make -s status)"
          } >> "$GITHUB_STEP_SUMMARY"
